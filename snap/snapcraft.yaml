name: hwdash
base: core22
adopt-info: hwdash
summary: 'Terminal CPU, memory, GPU and process monitor'
description: |
  hwdash is a terminal hardware monitor based on nvtop. It combines host CPU
  and memory monitoring with nvtop's multi-vendor accelerator backends.
license: GPL-3.0-or-later
issues: https://github.com/etan68/hwdash/issues
icon: desktop/hwdash.svg
grade: stable
confinement: strict
architectures:
- build-on: amd64
- build-on: arm64
- build-on: armhf
- build-on: ppc64el
- build-on: s390x
compression: lzo
apps:
  hwdash:
    command: usr/bin/hwdash
    desktop: usr/share/applications/hwdash.desktop
    plugs:
    - opengl
    - home
    - hardware-observe
    - process-control
    - system-observe
    # - kubernetes-support # Temporarily required to display AMD GPU processes. Once apparmor allows @{PROC}/[0-9]*/fdinfo/ through system-observe, this can be removed.
# layout:
#   /usr/share/libdrm:
#     symlink: $SNAP/usr/share/libdrm
parts:
  libdrm:
    source: https://gitlab.freedesktop.org/mesa/drm.git
    source-tag: libdrm-2.4.113
    plugin: meson
    meson-parameters:
    - --prefix=/usr
    - --sysconfdir=/etc
    - --libdir=lib/$CRAFT_ARCH_TRIPLET
    - -Dradeon=enabled
    - -Damdgpu=enabled
    - -Dudev=true
    - -Dnouveau=enabled
    - -Dintel=enabled
    build-packages:
    - meson
    - pkg-config
    - libudev-dev
    - libpciaccess-dev
    stage-packages:
    - libpciaccess0
    prime:
    - -usr/include
    - -usr/lib/$CRAFT_ARCH_TRIPLET/pkgconfig
  hwdash:
    after: [ libdrm ]
    source: .
    plugin: cmake
    cmake-parameters:
    - -DCMAKE_INSTALL_PREFIX=/usr
    - -DNVIDIA_SUPPORT=ON
    - -DAMDGPU_SUPPORT=ON
    - -DINTEL_SUPPORT=ON
    override-pull: |
      set -eux
      craftctl default
      VERSION="$(git describe --tags $(git rev-list --tags --max-count=1))"
      craftctl set version=$VERSION
      git checkout $VERSION
    build-snaps:
    - cmake
    build-packages:
    - gcc
    - libncurses-dev
    - libsystemd-dev
    stage-packages:
    - libncurses6
    - libncursesw6
    - libsystemd0
    prime:
    - -usr/share/doc
